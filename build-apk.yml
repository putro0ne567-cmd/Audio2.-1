name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur proyek
        run: |
          B=app/src/main
          J=$B/java/com/stereodsp
          mkdir -p $J/dsp $J/audio $J/data $J/ui $B/res/values
          mv -f Biquad.kt ChannelProcessor.kt ChannelSettings.kt FilterChain.kt $J/dsp/
          mv -f AudioEngine.kt $J/audio/
          mv -f PresetStore.kt $J/data/
          mv -f StereoDspApp.kt $J/ui/
          mv -f MainActivity.kt DspViewModel.kt $J/
          mv -f AndroidManifest.xml $B/
          mv -f strings.xml themes.xml $B/res/values/
          mv -f app-build.gradle.kts app/build.gradle.kts
          mv -f root-build.gradle.kts build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StereoDSP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
